[project]
name = "forewarn-convert"
version = "0.0.0"
description = "Timestral -> Core ML conversion for Forewarn"
requires-python = ">=3.12,<3.13"
dependencies = [
    "timestral @ git+https://github.com/mistralai/timestral.git@a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff",
    "coremltools==9.0",
    "numpy==2.3.*",  # 2.4+ turned ndim>0 -> scalar into an error; coremltools 9.0 still relies on it
    "torch==2.7.*",  # newest torch coremltools 9.0 is tested with
]

[tool.uv]
package = false
