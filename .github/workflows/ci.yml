name: CI

# The full suite runs locally before every push (`make check` via the pre-push hook, see `make hooks`).
# CI only covers what skips that hook: pull requests (Dependabot included) and manual runs.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: macos-26
    # make check runs the code it checks out: the token only reads. A hung UI test stops here, not at six hours.
    permissions:
      contents: read
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      # Downloads only: brew install still runs, and installs from them when they are current.
      - name: Cache Homebrew downloads
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: brew-${{ runner.os }}-${{ runner.arch }}-

      - name: Install tools
        run: brew install xcodegen swiftlint swiftformat

      - name: Lint, test, build, UI tests
        run: make check

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcresult
          path: build/Logs/Test/*.xcresult
