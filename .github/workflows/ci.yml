name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: macos-26
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Install tools
        run: brew install xcodegen swiftlint swiftformat

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build app
        run: make build XCODEBUILD_FLAGS="CODE_SIGNING_ALLOWED=NO"

      - name: UI tests
        run: make uitest

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: build/Logs/Test/*.xcresult
